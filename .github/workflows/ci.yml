name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Scan tracked files for private data
        run: node scripts/scan-private-data.js

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:extension

      - uses: actions/upload-artifact@v4
        with:
          name: agent-ref-vsix
          path: build/*.vsix
          if-no-files-found: error
